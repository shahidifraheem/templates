<!DOCTYPE html>
<html lang="en">

<head>
    <title>Under Maintenance</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .cs-maintenance-container {
            padding: 100px 30px;
            gap: 40px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .cs-logo {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            text-align: center;
            font-size: 30px;
            text-transform: uppercase;
            color: #222;
            z-index: 1;
        }

        .cs-logo span {
            color: #fcbc04;
        }


        .cs-title {
            font-size: 48px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }

        .cs-subtitle {
            font-size: 22px;
            font-weight: 500;
            color: #555;
            margin-bottom: 20px;
        }

        .cs-description {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        /* SOCIAL LINKS */
        .cs-social-links {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .cs-social-links .cs-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.3s ease;
            opacity: 0.9;
        }

        .cs-social-links .cs-icon svg {
            width: 28px;
            height: 28px;
            fill: #222;
            transition: 0.3s ease;
        }

        /* Hover */
        .cs-social-links .cs-icon:hover {
            transform: translateY(-6px);
            opacity: 1;
        }

        .cs-social-links .cs-icon:hover svg {
            fill: #fcbc04;
        }

        /* RESPONSIVE */
        @media(max-width: 768px) {
            .cs-notify-form {
                flex-direction: column;
                align-items: center;
            }

            .cs-title {
                font-size: 30px;
            }

            .cs-countdown {
                gap: 15px;
                justify-content: center;
            }

            .cs-time-box span {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="cs-maintenance-container">

        <div class="cs-logo">
            <h2>Lo<span>g</span>o<span>.</span></h2>
        </div>

        <h1 class="cs-title">We’ll Be Back Soon</h1>
        <h3 class="cs-subtitle">Our Website is Under Maintenance</h3>

        <p class="cs-description">
            We’re currently improving our website to give you a better experience.
            Enter your email below and we’ll notify you when everything is back online.
        </p>

        <!-- SOCIAL LINKS -->
        <div class="cs-social-links">
            <a href="#" target="_blank" class="cs-icon">
                <!-- Facebook -->
                <svg viewBox="0 0 24 24">
                    <path
                        d="M22 12.06C22 6.48 17.52 2 11.94 2S2 6.48 2 12.06c0 4.99 3.66 9.12 8.44 9.88v-6.99H8.08v-2.89h2.36V9.94c0-2.33 1.39-3.62 3.52-3.62 1.02 0 2.09.18 2.09.18v2.31h-1.18c-1.16 0-1.52.72-1.52 1.46v1.75h2.59l-.41 2.89h-2.18v6.99C18.34 21.18 22 17.05 22 12.06z" />
                </svg>
            </a>

            <a href="#" target="_blank" class="cs-icon">
                <!-- Twitter (X) -->
                <svg viewBox="0 0 24 24">
                    <path
                        d="M18.25 2H21l-6.56 7.49L22 22h-6.44l-4.53-6.39L5.7 22H3l6.84-7.82L2 2h6.53l4.1 5.87L18.25 2zM10.1 4H6.42l3.29 4.72L12.7 14l3.3 4.63H17.6l-3.4-4.75L10.1 4z" />
                </svg>
            </a>

            <a href="#" target="_blank" class="cs-icon">
                <!-- New Instagram Icon (2024 style) -->
                <svg viewBox="0 0 24 24">
                    <path
                        d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm4.5 5.3A4.7 4.7 0 1 0 16.7 12 4.7 4.7 0 0 0 12 7.3zm6.2-.8a1.3 1.3 0 1 0-1.3 1.3 1.3 1.3 0 0 0 1.3-1.3zM12 9.1A2.9 2.9 0 1 1 9.1 12 2.9 2.9 0 0 1 12 9.1z" />
                </svg>
            </a>

            <a href="#" target="_blank" class="cs-icon">
                <!-- LinkedIn -->
                <svg viewBox="0 0 24 24">
                    <path
                        d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1 4.98 2.12 4.98 3.5zM.5 8h4V24h-4V8zm7.5 0h3.8v2.2h.1c.5-.9 1.8-2.2 4-2.2 4.3 0 5.1 2.8 5.1 6.4V24h-4v-7.9c0-1.9 0-4.3-2.6-4.3-2.6 0-3 2-3 4.2V24h-4V8z" />
                </svg>
            </a>

            <a href="#" target="_blank" class="cs-icon">
                <!-- YouTube -->
                <svg viewBox="0 0 24 24">
                    <path
                        d="M23.5 6.2s-.2-1.7-.9-2.4c-.9-.9-1.9-.9-2.4-1C17.2 2.5 12 2.5 12 2.5s-5.2 0-8.2.3c-.5.1-1.5.1-2.4 1C.7 4.5.5 6.2.5 6.2S.2 8.3.2 10.4v1.9c0 2.1.3 4.2.3 4.2s.2 1.7.9 2.4c.9.9 2.1.8 2.7.9 2 .2 8 .3 8 .3s5.2 0 8.2-.3c.5-.1 1.5-.1 2.4-1 .7-.7.9-2.4.9-2.4s.3-2.1.3-4.2v-1.9c0-2.1-.3-4.2-.3-4.2zM9.7 14.8V8.9l6.1 2.9-6.1 3z" />
                </svg>
            </a>
        </div>

    </div>

    <script>
        // Countdown Timer
        const targetDate = new Date("Dec 31, 2025 23:59:59").getTime();

        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);
    </script>

</body>

</html>
