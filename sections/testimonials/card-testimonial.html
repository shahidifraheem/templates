<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Testimonials Slider</title>
</head>

<body>
    <!-- HTML -->
    <section class="testimonial-slider">
        <h2>What Our Clients Say</h2>
        <div class="slider">
            <div class="slide active">
                <p>"Great service, highly recommend!"</p>
                <h4>- John Doe</h4>
            </div>
            <div class="slide">
                <p>"Amazing support and fast response."</p>
                <h4>- Jane Smith</h4>
            </div>
            <div class="slide">
                <p>"Professional and reliable team."</p>
                <h4>- Michael Brown</h4>
            </div>
        </div>
        <button class="prev">❮</button>
        <button class="next">❯</button>
    </section>

    <!-- CSS -->
    <style>
        .testimonial-slider {
            position: relative;
            width: 400px;
            margin: 50px auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .slider {
            overflow: hidden;
        }

        .slide {
            display: none;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .slide.active {
            display: block;
        }

        button.prev,
        button.next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #007BFF;
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }

        button.prev {
            left: -50px;
        }

        button.next {
            right: -50px;
        }
    </style>

    <!-- JS -->
    <script>
        const slides = document.querySelectorAll('.slide');
        let index = 0;

        document.querySelector('.next').addEventListener('click', () => {
            slides[index].classList.remove('active');
            index = (index + 1) % slides.length;
            slides[index].classList.add('active');
        });

        document.querySelector('.prev').addEventListener('click', () => {
            slides[index].classList.remove('active');
            index = (index - 1 + slides.length) % slides.length;
            slides[index].classList.add('active');
        });
    </script>

</body>

</html>
