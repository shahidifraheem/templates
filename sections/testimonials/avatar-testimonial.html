<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Testimonials Slider</title>
</head>

<body>
    <!-- HTML -->
    <section class="testimonial-avatar">
        <h2>Client Feedback</h2>
        <div class="testimonial-container">
            <div class="testimonial-item">
                <img src="https://i.pravatar.cc/100?img=1" alt="Avatar">
                <p>"Exceptional service and quality!"</p>
                <h4>- David</h4>
            </div>
            <div class="testimonial-item">
                <img src="https://i.pravatar.cc/100?img=2" alt="Avatar">
                <p>"Truly exceeded my expectations."</p>
                <h4>- Emma</h4>
            </div>
            <div class="testimonial-item">
                <img src="https://i.pravatar.cc/100?img=3" alt="Avatar">
                <p>"Friendly team and great results."</p>
                <h4>- Liam</h4>
            </div>
        </div>
    </section>

    <!-- CSS -->
    <style>
        .testimonial-avatar {
            background: linear-gradient(120deg, #6a11cb, #2575fc);
            color: #fff;
            padding: 50px 20px;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .testimonial-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .testimonial-item {
            max-width: 250px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .testimonial-item img {
            border-radius: 50%;
            margin-bottom: 15px;
        }
    </style>

</body>

</html>
